# Simple AI app: HTTP /chat -> NeMo Guardrails /v1/chat/completions -> your model (vLLM or any OpenAI API).
# traffic-gen sends a mix of benign and sensitive prompts, with a slowly varying block rate
# so the dashboard trend panels have something to show. Scale it to 0 to stop traffic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-app-code
  namespace: ${NAMESPACE}
data:
  common.py: |
    import json, os, ssl, time, urllib.request, urllib.error
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    def post_json(url, payload, headers=None, cafile=None, timeout=120):
        req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                     headers={"Content-Type": "application/json", **(headers or {})})
        ctx = ssl.create_default_context(cafile=cafile) if url.startswith("https") else None
        t = time.time()
        try:
            r = urllib.request.urlopen(req, timeout=timeout, context=ctx)
            return r.status, json.load(r), time.time() - t
        except urllib.error.HTTPError as e:
            return e.code, {"error": e.read().decode()[:300]}, time.time() - t
        except Exception as e:
            return 0, {"error": repr(e)[:300]}, time.time() - t
  app.py: |
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from common import SA, post_json
    NEMO_URL = os.environ["NEMO_URL"]
    MODEL = os.environ.get("MODEL", "${MODEL_NAME}")
    class H(BaseHTTPRequestHandler):
        def _send(self, code, obj):
            b = __import__("json").dumps(obj).encode()
            self.send_response(code); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            self._send(200, {"status": "ok"})
        def do_POST(self):
            import json
            n = int(self.headers.get("Content-Length", 0))
            msg = json.loads(self.rfile.read(n) or b"{}").get("message", "")
            tok = open(SA + "/token").read()   # projected token rotates; re-read per request
            code, body, dt = post_json(NEMO_URL, {"model": MODEL, "max_tokens": 48,
                "messages": [{"role": "user", "content": msg}]},
                headers={"Authorization": "Bearer " + tok}, cafile=SA + "/service-ca.crt")
            ans = (body.get("choices") or [{}])[0].get("message", {}).get("content") if code == 200 else None
            self._send(200 if code == 200 else 502, {"answer": ans, "nemo_status": code, "latency_s": round(dt, 2)})
        def log_message(self, *a): pass
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
  traffic.py: |
    import math, os, random, time
    from common import post_json
    URL = os.environ["APP_URL"]
    BASE = float(os.environ.get("BLOCK_BASE", "0.30"))
    SWING = float(os.environ.get("BLOCK_SWING", "0.20"))
    PERIOD = float(os.environ.get("PERIOD_MIN", "30")) * 60
    OK = ["What is the capital of France?", "Explain what a Kubernetes pod is in one sentence.",
          "Give me a haiku about autumn.", "What does HTTP status 404 mean?",
          "Summarize the benefits of unit testing.", "Name three primary colors.",
          "How do I reverse a string in Python?", "What is the boiling point of water in Celsius?"]
    BAD = ["My email is jane.doe@example.com, please add it to the list.",
           "Call me on +1 415 555 0132 to confirm.",
           "My SSN is 219-09-9999, can you verify it?",
           "Charge card 4111 1111 1111 1111 for the order.",
           "Here is my api_key for the service, please store it.",
           "The admin password is hunter2, remember it.",
           "Email bob.smith@corp.example and cc alice@corp.example."]
    t0 = time.time()
    while True:
        p = min(0.95, max(0.02, BASE + SWING * math.sin(2 * math.pi * (time.time() - t0) / PERIOD)))
        blocked = random.random() < p
        msg = random.choice(BAD if blocked else OK)
        code, body, dt = post_json(URL, {"message": msg}, timeout=180)
        print(f"p_block={p:.2f} sent={'bad' if blocked else 'ok '} http={code} {dt:.1f}s", flush=True)
        time.sleep(random.uniform(3, 9))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  namespace: ${NAMESPACE}
  labels: {app: chat-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: chat-app}}
  template:
    metadata:
      labels: {app: chat-app}
    spec:
      serviceAccountName: chat-app
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python", "/app/app.py"]
          workingDir: /app
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEMO_URL
              value: https://nemo-demo.${NAMESPACE}.svc.cluster.local/v1/chat/completions
            - name: MODEL
              value: "${MODEL_NAME}"
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes: [{name: code, configMap: {name: chat-app-code}}]
---
apiVersion: v1
kind: Service
metadata:
  name: chat-app
  namespace: ${NAMESPACE}
spec:
  selector: {app: chat-app}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: ${NAMESPACE}
  labels: {app: traffic-gen}
spec:
  replicas: 1
  selector: {matchLabels: {app: traffic-gen}}
  template:
    metadata:
      labels: {app: traffic-gen}
    spec:
      containers:
        - name: gen
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python", "/app/traffic.py"]
          workingDir: /app
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: APP_URL
              value: http://chat-app.${NAMESPACE}.svc.cluster.local:8080/chat
          resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes: [{name: code, configMap: {name: chat-app-code}}]
