# EXAMPLE, not applied by deploy.sh. Verified once on RHOAI 3.5.1 (NeMo 0.24.0.dev0, 2026-10-26): the image
# accepts rails.config.sensitive_data_detection.recognizers (TrustyAI's default PII config in the operator repo
# uses the same keys: config/configmaps/nemo-guardrails/default-guardrails-pii.yaml). Results through /v1/checks:
#   "My national ID is 1012345678" and "...2012345678"  -> blocked by `detect sensitive data on input`
#   "The log line has timestamp 1700000000"            -> blocked too (shape-only false positive)
#   "The ticket id is 3012345678", "The order number is 412345678" -> passed
# Presidio's built-ins alone return nothing for the blocked IDs, so the custom recognizer is what fired.
# A config load error would return HTTP 200 with "Could not load the [...] guardrails configuration"; read the pod logs.
#
# Shows a CUSTOM, locale-specific recognizer next to Presidio's built-in entities.
#   - Built-in entities (EMAIL_ADDRESS, PHONE_NUMBER, US_SSN, CREDIT_CARD) come with validation. US_SSN
#     rejects numbers that cannot be real SSNs, so you do not add a regex for them.
#   - SAUDI_NATIONAL_ID has no built-in recognizer, so it is defined here: ten digits starting with 1 or 2.
#     It checks the shape only. It also matches any ten-digit number starting with 1 or 2, such as the Unix
#     timestamp 1700000000, so expect false positives on numeric data.
#   - A custom entity has to be defined under `recognizers` AND listed under input/output `entities`.
#
# Apply into a scratch namespace (needs the Secret model-api-key that deploy.sh creates):
#   export NAMESPACE=guardrails-custom MODEL_NAME=... MODEL_BASE_URL=...
#   source scripts/_common.sh && render examples/custom-recognizer.yaml | oc apply -f -
# Then POST {"model": "...", "messages": [{"role": "user", "content": "My national ID is 1012345678"}]} to
# /v1/checks on the nemo-custom Service and compare it with "The ticket id is 3012345678", which passes.
# Do not use a 10-digit number that starts with 5 as the control: Presidio reads 5012345678 as a US phone
# number (PHONE_NUMBER, 0.75) and blocks it for that reason.
apiVersion: v1
kind: ConfigMap
metadata: {name: nemo-custom-config, namespace: ${NAMESPACE}}
data:
  config.yaml: |
    models:
      - type: main
        engine: openai
        model: ${MODEL_NAME}
        api_key_env_var: MODEL_API_KEY
        parameters:
          base_url: ${MODEL_BASE_URL}
    rails:
      config:
        sensitive_data_detection:
          recognizers:
            - name: "Saudi National ID"
              supported_entity: "SAUDI_NATIONAL_ID"
              patterns:
                - name: "saudi_national_id_regex"
                  regex: "(\\b[1-2]\\d{9}\\b)"
                  score: 1
          input:
            entities: [EMAIL_ADDRESS, PHONE_NUMBER, US_SSN, CREDIT_CARD, SAUDI_NATIONAL_ID]
            score_threshold: 0.5
          output:
            entities: [EMAIL_ADDRESS, PHONE_NUMBER, US_SSN, CREDIT_CARD, SAUDI_NATIONAL_ID]
            score_threshold: 0.5
      input:
        flows:
          - detect sensitive data on input
      output:
        flows:
          - detect sensitive data on output
  rails.co: |
    # built-in rails only
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata: {name: nemo-custom, namespace: ${NAMESPACE}}
spec:
  nemoConfigs:
    - name: nemo-custom-config
      configMaps: [nemo-custom-config]
      default: true
  env:
    - name: MODEL_API_KEY
      valueFrom: {secretKeyRef: {name: model-api-key, key: API_KEY}}
